name: Create Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Create release.zip excluding git and local script files
      - name: Package System
        run: |
          zip -r ./release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "node_modules/*" \
            -x "*.sh" \
            -x "release.zip"

      # Update or create release with release.zip and system.json
      - name: Update Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: './release.zip,system.json'
          token: ${{ secrets.GITHUB_TOKEN }}
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true